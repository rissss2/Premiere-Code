<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PremierePro Learning</title>

    <link rel="stylesheet" href="Learner.css" />
</head>
<body>

    <!-- 背景 -->
    <div class="bg-glow left"></div>
    <div class="bg-glow right"></div>

    <!-- 左上ロゴ -->
    <div class="logo-image">
        <img src="Adobe-Premiere-Pro-Logo.webp" alt="Premiere Pro">
    </div>

    <!-- メイン -->
    <main class="container">

        <h1 class="title">PremierePro</h1>

        <!-- 状態別表示 -->
        <div class="top-menu">

            <div class="toggle-wrap">

                <span>状態別表示</span>

                <label class="switch">
                    <input type="checkbox" id="groupToggle">
                    <span class="slider"></span>
                </label>

            </div>

        </div>

        <!-- リスト -->
        <div class="task-list" id="taskList">

            <!-- 1-1 -->
            <div class="task-card pending" id="course-1-1">

                <a href="./Couse/1-1.html" class="card-link">

                    <div class="task-left">

                        <div class="icon">🚀</div>

                        <span class="tag red">
                            講座
                        </span>

                        <span class="task-title">
                            1-1　ショートカットキーの設定
                        </span>

                    </div>

                    <div class="status pending-status">
                        未完了
                    </div>

                </a>

            </div>

            <!-- 1-2 -->
            <div class="task-card pending" id="course-1-2">

                <a href="./Couse/1-2.html" class="card-link">

                    <div class="task-left">

                        <div class="icon">🚀</div>

                        <span class="tag red">
                            講座
                        </span>

                        <span class="task-title">
                            1-2　Coming soon...
                        </span>

                    </div>

                    <div class="status pending-status">
                        未完了
                    </div>

                </a>

            </div>

            <!-- 1-3 -->
            <div class="task-card pending" id="course-1-3">

                <a href="./Couse/1-3.html" class="card-link">

                    <div class="task-left">

                        <div class="icon">🚀</div>

                        <span class="tag red">
                            講座
                        </span>

                        <span class="task-title">
                            1-3　Coming soon...
                        </span>

                    </div>

                    <div class="status pending-status">
                        未完了
                    </div>

                </a>

            </div>

        </div>

    </main>

    <script src="Learner.js"></script>

</body>
</html>
