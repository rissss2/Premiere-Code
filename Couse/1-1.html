<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremierePro 1-1</title>

    <link rel="stylesheet" href="./Style.css">
</head>
<body>

    <!-- 背景 -->
    <div class="bg-glow left"></div>
    <div class="bg-glow right"></div>

    <!-- ヘッダー -->
    <header class="header">

        <a href="../Learner.html" class="back-btn">
            ← 戻る
        </a>

        <h1 class="page-title">
            1-1
        </h1>

    </header>

    <!-- コンテンツ -->
    <main class="course-container">

        <!-- セクション1 -->
        <section class="lesson-card">

            <div class="lesson-image">

                <img src="./1-1/1-1-1.png" alt="PremierePro">

            </div>

            <div class="lesson-content">

                <h2>
                    1. ショートカットキーの設定方法(１)
                </h2>

                <p>
                    画面左上の「編集」ボタンを押す
                </p>

            </div>

        </section>

        <!-- セクション2 -->
        <section class="lesson-card">

            <div class="lesson-image">

                <img src="./1-1/1-1-2.png" alt="PremierePro">

            </div>

            <div class="lesson-content">

                <h2>
                    2. ショートカットキーの設定方法(２)
                </h2>

                <p>
                    メニューの中の「キーボードショートカット」を押す
                </p>

            </div>

        </section>

        <!-- セクション3 -->
        <section class="lesson-card">

            <div class="lesson-image">

                <img src="./1-1/1-1-3.png" alt="PremierePro">

            </div>

            <div class="lesson-content">

                <h2>
                    3. ショートカットキーの設定方法(３)
                </h2>

                <p>
                    この画面でショートカットキーを変更します
                </p>

            </div>

        </section>

        <!-- セクション4 -->
        <section class="lesson-card">

            <div class="lesson-image">

                <img src="./1-1/1-1-4.png" alt="PremierePro">

            </div>

            <div class="lesson-content">

                <h2>
                    4. ショートカットキーの設定方法(４)
                </h2>

                <p>
                    設定が終わったら右下のOKボタンを押して終了します
                </p>

            </div>

        </section>

    </main>

    <!-- 完了ボタン -->
    <div class="complete-area">

        <button class="complete-btn" id="completeBtn">
            ✓ この講座を完了する
        </button>

    </div>

    <script src="./script.js"></script>

</body>
</html>
